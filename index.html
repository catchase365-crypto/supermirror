<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>物理级多边形深渊镜 - S Pen 压感创作</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      overflow: hidden;
      background-color: #07080a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      touch-action: none;
    }
    #stage {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .hud-title {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 10;
      color: #cfd6e0;
      background: rgba(15, 18, 24, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
    .hud-title h1 {
      font-size: 14px;
      font-weight: 600;
      color: #00f0ff;
      margin-bottom: 2px;
    }
    .hud-title p {
      font-size: 11px;
      color: #8c9ba8;
    }

    /* 右侧悬浮收起/展开按钮 (紧凑贴角) */
    .drawer-toggle-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 25;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(18, 22, 30, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.25s;
    }
    .drawer-toggle-btn.collapsed {
      background: rgba(14, 16, 22, 0.85);
      border-color: rgba(255, 255, 255, 0.2);
      color: #94a3b8;
    }

    /* 右侧控制面板 (精简紧凑 + 留足底部安全区不遮挡 + 原生流畅顺滑滚动) */
    .control-drawer {
      position: absolute;
      top: 10px;
      right: 10px;
      width: clamp(245px, 76vw, 275px);
      max-height: calc(100dvh - 20px);
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      z-index: 20;
      background: rgba(14, 16, 22, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 10px 85px 10px;
      padding-top: 36px;
      color: #cfd6e0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 7px;
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.25s;
    }
    .control-drawer.collapsed {
      transform: translateX(calc(100% + 30px));
      opacity: 0;
      pointer-events: none;
    }
    #setLedColorBtn.picking {
      border-color: #00f0ff !important;
      background: rgba(0, 240, 255, 0.25) !important;
      color: #00f0ff !important;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-title span.val {
      color: #00f0ff;
      font-family: monospace;
      font-size: 11px;
    }

    /* 形状选择栏（三角、正方、圆形、16:9长方形） */
    .shape-btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .shape-btn {
      padding: 7px 0;
      font-size: 11px;
    }
    .shape-btn {
      padding: 7px 0;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #181c26;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .shape-btn.active {
      background: rgba(0, 240, 255, 0.18);
      border-color: #00f0ff;
      color: #00f0ff;
      font-weight: 600;
    }

    /* 外框灯带显眼独立切换按钮 */
    .toggle-led-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      border: 1px solid #00f0ff;
      background: rgba(0, 240, 255, 0.15);
      color: #00f0ff;
    }
    .toggle-led-btn.off {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #181c26;
      color: #64748b;
    }

    /* 1:1 紧凑画板容器 (大幅缩小纵向占比，允许手指滑动画板区域) */
    .canvas-box {
      position: relative;
      width: 175px;
      height: 175px;
      margin: 0 auto;
      background: #050608;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      touch-action: pan-y;
    }
    /* 笔迹层 (允许手指滚动穿透，只捕获 S Pen) */
    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      z-index: 1;
      touch-action: pan-y;
    }
    /* 纯 UI 辅助指引层（不参与 WebGL 渲染，绝不进镜子） */
    #guideCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      background: #232733;
      border-radius: 3px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
    }

    /* 10x10 正方形调色盘与工具栏 */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      background: #0d0f14;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2px;
      border: 1px solid rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.08s;
    }
    .color-swatch.active {
      outline: 2px solid #ffffff;
      outline-offset: -1px;
      transform: scale(1.18);
      z-index: 2;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #181c26;
      color: #cfd6e0;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="stage"></div>

  <div class="hud-title">
    <h1>物理级深渊镜 - 纯净手绘模式</h1>
    <p>3D 视角：拖拽旋转 / 滚轮缩放 / 右键平移</p>
  </div>

  <!-- 折叠/展开合一按钮 -->
  <button id="drawerToggleBtn" class="drawer-toggle-btn" title="收起/展开设置面板">✕</button>

  <div class="control-drawer" id="controlDrawer">
    <!-- 外框形状切换：含 16:9 竖屏手机比例 -->
    <div class="slider-row">
      <div class="section-title">
        <span>镜体外框形状</span>
        <span class="val" id="shapeValText">三角形</span>
      </div>
      <div class="shape-btn-group">
        <button class="shape-btn active" data-shape="triangle">△ 三角</button>
        <button class="shape-btn" data-shape="square">□ 正方</button>
        <button class="shape-btn" data-shape="circle">○ 圆形</button>
        <button class="shape-btn" data-shape="rect16_9">▯ 16:9</button>
      </div>
    </div>

    <!-- 陀螺仪与正面满屏居中按钮组合 -->
    <div style="display:flex; gap:6px;">
      <button class="toggle-led-btn off" id="gyroToggleBtn" style="flex:1; border-color: rgba(255, 170, 0, 0.4); color: #ffaa00;">
        <span id="gyroStatusDot">○</span>
        <span id="gyroStatusText">陀螺仪体感</span>
      </button>
      <button class="btn" id="resetViewBtn" style="padding:0 12px; font-size:11px; white-space:nowrap; border-color:rgba(0,240,255,0.3); color:#00f0ff;" title="重置回正面满屏居中视角">正面居中</button>
    </div>

    <!-- 显眼外框灯带启闭与专属改色按钮 -->
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="toggle-led-btn" id="toggleLedBtn" style="flex:1;">
        <span id="ledStatusDot">●</span>
        <span id="ledStatusText">外框灯带：开启</span>
      </button>
      <button class="btn" id="setLedColorBtn" style="padding:7px 10px; display:flex; align-items:center; gap:5px;" title="点击激活后，点下方色盘修改外灯">
        <span id="ledColorDot" style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#00f0ff;"></span>
        <span id="setLedColorText">改色</span>
      </button>
    </div>

    <!-- 1:1 纯净画板 (1024x1024 超清消除颗粒) -->
    <div class="slider-row">
      <div class="section-title">
        <span>S Pen 压感画板 (1:1 正比例)</span>
        <span class="val" id="pressureText">压感: 0.00</span>
      </div>
      <div class="canvas-box">
        <canvas id="drawCanvas" width="1024" height="1024"></canvas>
        <canvas id="guideCanvas" width="1024" height="1024"></canvas>
      </div>
    </div>

    <!-- 10x10 正方形调色盘 (100色) -->
    <div class="slider-row">
      <div class="section-title">
        <span id="paletteTitle">画笔调色盘 (10×10)</span>
        <span class="val" id="colorValText">#00f0ff</span>
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>

    <div class="tool-group">
      <button class="btn" id="eraserBtn">橡皮</button>
      <button class="btn" id="clearBtn" style="margin-left:auto;">清空画板</button>
    </div>

    <!-- 粗细与间距调节 -->
    <div class="slider-row">
      <div class="section-title">
        <span>画笔粗细</span>
        <span class="val" id="sizeValText">5 px</span>
      </div>
      <input type="range" id="brushSize" min="2" max="24" step="1" value="5">
    </div>

    <div class="slider-row">
      <div class="section-title">
        <span>反射间距 (框架厚度)</span>
        <span class="val" id="depthValText">0.18 m</span>
      </div>
      <input type="range" id="depthSlider" min="0.05" max="0.45" step="0.01" value="0.18">
    </div>

    <div class="slider-row">
      <div class="section-title">
        <span>灯光亮度</span>
        <span class="val" id="brightValText">1.8x</span>
      </div>
      <input type="range" id="brightSlider" min="0.5" max="4.0" step="0.1" value="1.8">
    </div>

    <!-- 镜面深度 / 最远传导距离控制 -->
    <div class="slider-row">
      <div class="section-title">
        <span>镜面深度 (传导极限)</span>
        <span class="val" id="maxDepthValText">55 层</span>
      </div>
      <input type="range" id="maxDepthSlider" min="15" max="95" step="1" value="55">
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 双层解耦画板：笔迹层 (WebGL纹理) 与 指引层 (纯视觉UI)
    // ==========================================
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
    const guideCanvas = document.getElementById('guideCanvas');
    const guideCtx = guideCanvas.getContext('2d');

    const pressureText = document.getElementById('pressureText');
    const brushSizeSlider = document.getElementById('brushSize');
    const sizeValText = document.getElementById('sizeValText');

    let currentShape = 'triangle';
    let currentColor = '#00f0ff';
    let isEraser = false;
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    // 清空笔迹画板（纯透明底，确保不向镜面传入杂光底色）
    function clearDrawCanvas() {
      drawCtx.clearRect(0, 0, 1024, 1024);
      if (window.canvasTexture) window.canvasTexture.needsUpdate = true;
    }
    clearDrawCanvas();

    // 仅在前端 UI 上绘制边界虚线，不进入 WebGL 纹理
    function drawUIGuide(shape) {
      guideCtx.clearRect(0, 0, 1024, 1024);
      guideCtx.save();
      guideCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      guideCtx.lineWidth = 3.0;
      guideCtx.setLineDash([10, 10]);
      guideCtx.beginPath();

      const cx = 512, cy = 512;
      if (shape === 'square') {
        const half = (1.25 / 1.4) * 512;
        guideCtx.strokeRect(cx - half, cy - half, half * 2, half * 2);
      } else if (shape === 'circle') {
        const r = (1.35 / 1.4) * 512;
        guideCtx.arc(cx, cy, r, 0, Math.PI * 2);
        guideCtx.stroke();
      } else if (shape === 'rect16_9') {
        const halfH = (1.35 / 1.4) * 512;
        const halfW = (0.76 / 1.4) * 512;
        guideCtx.strokeRect(cx - halfW, cy - halfH, halfW * 2, halfH * 2);
      } else { // 三角形
        const R = (1.45 / 1.4) * 512;
        const p0x = cx, p0y = cy - R;
        const p1x = cx - R * 0.866, p1y = cy + R * 0.5;
        const p2x = cx + R * 0.866, p2y = cy + R * 0.5;
        guideCtx.moveTo(p0x, p0y);
        guideCtx.lineTo(p1x, p1y);
        guideCtx.lineTo(p2x, p2y);
        guideCtx.closePath();
        guideCtx.stroke();
      }
      guideCtx.restore();
    }
    drawUIGuide(currentShape);

    // 压感笔触输入处理 (翻倍像素密度，笔迹细腻顺滑)
    function drawStroke(x, y, pressure) {
      drawCtx.save();
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      let p = (pressure !== undefined && pressure > 0) ? pressure : 0.5;
      pressureText.textContent = `压感: ${p.toFixed(2)}`;

      const baseSize = parseFloat(brushSizeSlider.value);
      const strokeWidth = Math.max(3.0, baseSize * p * 4.4);
      drawCtx.lineWidth = strokeWidth;

      if (isEraser) {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.strokeStyle = 'rgba(0,0,0,1)';
      } else {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = currentColor;
      }

      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
      drawCtx.restore();

      lastX = x;
      lastY = y;
      if (window.canvasTexture) window.canvasTexture.needsUpdate = true;
    }

    function getCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const scale = 1024 / rect.width;
      return {
        x: (e.clientX - rect.left) * scale,
        y: (e.clientY - rect.top) * scale
      };
    }

    // 严格限制仅响应 S Pen 压感笔输入 (桌面调试允许鼠标)，彻底屏蔽手指触摸误画，手指可顺滑滚动画板与菜单
    drawCanvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'pen' && e.pointerType !== 'mouse') return;
      e.preventDefault();
      isDrawing = true;
      const pos = getCoords(e);
      lastX = pos.x;
      lastY = pos.y;
      drawStroke(pos.x, pos.y, e.pressure);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      if (e.pointerType !== 'pen' && e.pointerType !== 'mouse') return;
      e.preventDefault();
      const pos = getCoords(e);
      drawStroke(pos.x, pos.y, e.pressure);
    });

    const stopDrawing = () => {
      if (isDrawing) {
        isDrawing = false;
        pressureText.textContent = '压感: 0.00';
      }
    };
    window.addEventListener('pointerup', stopDrawing);
    window.addEventListener('pointercancel', stopDrawing);

    // 外框灯带独立选色逻辑
    let isPickingLedColor = false;
    const setLedColorBtn = document.getElementById('setLedColorBtn');
    const ledColorDot = document.getElementById('ledColorDot');
    const setLedColorText = document.getElementById('setLedColorText');
    const paletteTitle = document.getElementById('paletteTitle');

    setLedColorBtn.addEventListener('click', () => {
      isPickingLedColor = !isPickingLedColor;
      if (isPickingLedColor) {
        setLedColorBtn.classList.add('picking');
        setLedColorText.textContent = '点下方选色';
        paletteTitle.textContent = '请点选外灯颜色 ↴';
        paletteTitle.style.color = '#00f0ff';
      } else {
        setLedColorBtn.classList.remove('picking');
        setLedColorText.textContent = '改色';
        paletteTitle.textContent = '画笔调色盘 (10×10)';
        paletteTitle.style.color = '#94a3b8';
      }
    });

    // 动态生成 10x10 (100色) 调色盘
    const paletteGrid = document.getElementById('paletteGrid');
    const colorValText = document.getElementById('colorValText');
    const colorHelper = new THREE.Color();

    for (let r = 0; r < 10; r++) {
      for (let c = 0; c < 10; c++) {
        let cssColor;
        if (c === 9) {
          const l = Math.round(100 - r * 10);
          cssColor = `hsl(0, 0%, ${Math.max(4, l)}%)`;
        } else {
          const h = c * 40;
          const l = 88 - r * 7;
          cssColor = `hsl(${h}, 95%, ${l}%)`;
        }

        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.background = cssColor;
        swatch.setAttribute('data-color', cssColor);

        if (c === 4 && r === 4) {
          swatch.classList.add('active');
        }

        swatch.addEventListener('click', () => {
          colorHelper.setStyle(cssColor);
          const hexCode = '#' + colorHelper.getHexString();

          if (isPickingLedColor) {
            // 仅在明确点击“改色”时，才将选中的颜色赋予外框灯带
            ledColorDot.style.background = hexCode;
            if (mirrorShaderMat) {
              mirrorShaderMat.uniforms.uLedColor.value.set(
                colorHelper.r,
                colorHelper.g,
                colorHelper.b
              );
            }
            isPickingLedColor = false;
            setLedColorBtn.classList.remove('picking');
            setLedColorText.textContent = '改色';
            paletteTitle.textContent = '画笔调色盘 (10×10)';
            paletteTitle.style.color = '#94a3b8';
            return;
          }

          // 正常状态仅切换画笔颜色，绝不同步更改外框灯
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          currentColor = cssColor;
          isEraser = false;
          document.getElementById('eraserBtn').style.background = '#181c26';

          colorValText.textContent = hexCode;
          colorValText.style.color = hexCode;
        });

        paletteGrid.appendChild(swatch);
      }
    }

    document.getElementById('eraserBtn').addEventListener('click', () => {
      isEraser = true;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      document.getElementById('eraserBtn').style.background = 'rgba(0, 240, 255, 0.2)';
    });

    document.getElementById('clearBtn').addEventListener('click', clearDrawCanvas);
    brushSizeSlider.addEventListener('input', (e) => {
      sizeValText.textContent = `${e.target.value} px`;
    });

    // ==========================================
    // 2. 3D 渲染与几何构造（去除六边形）
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07080a);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.getElementById('stage').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.0;
    controls.maxDistance = 14;

    // 绑定 1:1 高清纹理：开启 Mipmap 与双线性抗锯齿，彻底消除深渊递归反射中的锯齿与噪点颗粒
    window.canvasTexture = new THREE.CanvasTexture(drawCanvas);
    canvasTexture.minFilter = THREE.LinearMipmapLinearFilter;
    canvasTexture.magFilter = THREE.LinearFilter;
    canvasTexture.generateMipmaps = true;

    // 面板收起/展开折叠合一按钮
    const drawerToggleBtn = document.getElementById('drawerToggleBtn');
    const controlDrawer = document.getElementById('controlDrawer');
    drawerToggleBtn.addEventListener('click', () => {
      const isCollapsed = controlDrawer.classList.toggle('collapsed');
      drawerToggleBtn.classList.toggle('collapsed', isCollapsed);
      drawerToggleBtn.textContent = isCollapsed ? '⚙' : '✕';
    });

    // 几何构建器：仅保留精确三角、正方、圆形
    function createShapePath(type, scale) {
      const s = new THREE.Shape();
      if (type === 'square') {
        const b = 1.25 * scale;
        s.moveTo(-b, -b);
        s.lineTo(b, -b);
        s.lineTo(b, b);
        s.lineTo(-b, b);
        s.closePath();
      } else if (type === 'circle') {
        const r = 1.35 * scale;
        s.absarc(0, 0, r, 0, Math.PI * 2, false);
      } else if (type === 'rect16_9') {
        const w = 0.76 * scale;
        const h = 1.35 * scale;
        s.moveTo(-w, -h);
        s.lineTo(w, -h);
        s.lineTo(w, h);
        s.lineTo(-w, h);
        s.closePath();
      } else { // triangle
        const R = 1.45 * scale;
        const v0 = new THREE.Vector2(0, R);
        const v1 = new THREE.Vector2(-R * 0.8660254, -0.5 * R);
        const v2 = new THREE.Vector2( R * 0.8660254, -0.5 * R);
        s.moveTo(v0.x, v0.y);
        s.lineTo(v1.x, v1.y);
        s.lineTo(v2.x, v2.y);
        s.closePath();
      }
      return s;
    }

    const mirrorAssembly = new THREE.Group();

    // 机械外壳模型
    const frameOuterShape = createShapePath(currentShape, 1.22);
    frameOuterShape.holes = [createShapePath(currentShape, 1.0)];
    const frameGeom = new THREE.ExtrudeGeometry(frameOuterShape, {
      depth: 1.0,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.015,
      bevelThickness: 0.015
    });
    frameGeom.translate(0, 0, -1.0);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x16181f,
      metalness: 0.9,
      roughness: 0.28
    });
    const frameMesh = new THREE.Mesh(frameGeom, frameMat);
    mirrorAssembly.add(frameMesh);

    // 封闭后盖板
    const backCoverGeom = new THREE.ShapeGeometry(createShapePath(currentShape, 1.22));
    const backCoverMat = new THREE.MeshStandardMaterial({
      color: 0x0d0e12,
      metalness: 0.9,
      roughness: 0.5
    });
    const backCover = new THREE.Mesh(backCoverGeom, backCoverMat);
    mirrorAssembly.add(backCover);

    // ==========================================
    // 3. 光学 Shader（1:1 等比无畸变映射 + 彻底清除虚线）
    // ==========================================
    const mirrorShaderMat = new THREE.ShaderMaterial({
      uniforms: {
        uCameraLocal: { value: new THREE.Vector3() },
        uCavityDepth: { value: 0.18 },
        uEnableEdgeLed: { value: 1.0 },
        uBrightness: { value: 1.8 },
        uMaxBounces: { value: 55.0 },
        uShapeType: { value: 0 }, // 0: 三角, 1: 正方, 2: 圆形
        uDrawTexture: { value: canvasTexture },
        uLedColor: { value: new THREE.Vector3(0.0, 0.94, 1.0) }
      },
      vertexShader: `
        varying vec3 vLocalPos;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPos;

        void main() {
          vLocalPos = position;
          vWorldNormal = normalize(mat3(modelMatrix) * normal);
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPos = worldPos.xyz;
          gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
      `,
      fragmentShader: `
        uniform vec3 uCameraLocal;
        uniform float uCavityDepth;
        uniform float uEnableEdgeLed;
        uniform float uBrightness;
        uniform float uMaxBounces;
        uniform int uShapeType;
        uniform sampler2D uDrawTexture;
        uniform vec3 uLedColor;

        varying vec3 vLocalPos;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPos;

        const int MAX_BOUNCES = 96;

        float distToSegment(vec2 p, vec2 a, vec2 b) {
          vec2 pa = p - a;
          vec2 ba = b - a;
          float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
          return length(pa - ba * h);
        }

        void main() {
          vec3 rayDir = normalize(vLocalPos - uCameraLocal);
          vec3 finalColor = vec3(0.001, 0.0012, 0.0018);

          if (rayDir.z < -0.001) {
            vec3 accumulatedLight = vec3(0.0);

            for (int k = 0; k < MAX_BOUNCES; k++) {
              if (float(k) >= uMaxBounces) break;
              float virtualDepth = (float(k) + 0.5) * uCavityDepth;
              float stepT = -virtualDepth / rayDir.z;
              vec2 hitPos = vLocalPos.xy + rayDir.xy * stepT;

              // 深度越大时，衰减率动态向高透镀膜趋近 (0.82 ~ 0.945)，让光线真正深邃传导
              float decayRate = mix(0.82, 0.945, clamp((uMaxBounces - 15.0) / 80.0, 0.0, 1.0));
              float bounceFactor = 0.42 * pow(decayRate, float(k));

              // 1. 各向同性 1:1 正比例映射 (X/Y 范围严格以 2.8 为基准，绝无拉伸压扁)
              vec2 drawUV = hitPos.xy / 2.8 + 0.5;

              if (drawUV.x >= 0.0 && drawUV.x <= 1.0 && drawUV.y >= 0.0 && drawUV.y <= 1.0) {
                vec4 stroke = texture2D(uDrawTexture, drawUV);
                if (stroke.a > 0.01) {
                  accumulatedLight += stroke.rgb * bounceFactor;
                }
              }

              // 2. 外框单圈灯带（可通过独立按钮一键关闭）
              if (uEnableEdgeLed > 0.5) {
                float edgeDist = 999.0;
                if (uShapeType == 1) { // 正方形精确外沿
                  vec2 d = abs(hitPos) - vec2(1.25);
                  edgeDist = abs(max(d.x, d.y));
                } else if (uShapeType == 2) { // 圆形精确外沿
                  edgeDist = abs(length(hitPos) - 1.35);
                } else if (uShapeType == 3) { // 16:9 竖屏长方形外沿
                  vec2 d = abs(hitPos) - vec2(0.76, 1.35);
                  edgeDist = abs(max(d.x, d.y));
                } else { // 三角形精确外沿
                  const vec2 V0 = vec2(0.0, 1.45);
                  const vec2 V1 = vec2(-1.2557368, -0.725);
                  const vec2 V2 = vec2( 1.2557368, -0.725);
                  float d0 = distToSegment(hitPos, V0, V1);
                  float d1 = distToSegment(hitPos, V1, V2);
                  float d2 = distToSegment(hitPos, V2, V0);
                  edgeDist = min(d0, min(d1, d2));
                }

                if (edgeDist < 0.04) {
                  float core = smoothstep(0.018, 0.002, edgeDist);
                  float microGlow = exp(-edgeDist * 75.0) * 0.25;
                  accumulatedLight += uLedColor * (core + microGlow) * bounceFactor;
                }
              }
            }
            finalColor += accumulatedLight * vec3(0.9, 0.96, 1.0) * uBrightness;
          }

          // 前玻璃表面微弱反光质感
          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          float fresnel = pow(1.0 - max(dot(viewDir, vWorldNormal), 0.0), 4.0);
          finalColor += vec3(0.04, 0.06, 0.08) * fresnel;

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `
    });

    const frontMirrorGeom = new THREE.ShapeGeometry(createShapePath(currentShape, 1.0));
    const frontMirror = new THREE.Mesh(frontMirrorGeom, mirrorShaderMat);
    mirrorAssembly.add(frontMirror);
    scene.add(mirrorAssembly);

    // 灯光
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xddeeff, 1.2);
    dirLight.position.set(3, 4, 5);
    scene.add(dirLight);

    // ==========================================
    // 4. 控制栏事件：外框灯带开关、形状切换、间距厚度
    // ==========================================
    const toggleLedBtn = document.getElementById('toggleLedBtn');
    const ledStatusText = document.getElementById('ledStatusText');
    let isLedOn = true;

    toggleLedBtn.addEventListener('click', () => {
      isLedOn = !isLedOn;
      mirrorShaderMat.uniforms.uEnableEdgeLed.value = isLedOn ? 1.0 : 0.0;
      if (isLedOn) {
        toggleLedBtn.classList.remove('off');
        ledStatusText.textContent = '外框灯带：开启';
      } else {
        toggleLedBtn.classList.add('off');
        ledStatusText.textContent = '外框灯带：已关闭 (纯手绘模式)';
      }
    });

    function setMirrorShape(type) {
      currentShape = type;
      const typeMap = { triangle: 0, square: 1, circle: 2, rect16_9: 3 };
      mirrorShaderMat.uniforms.uShapeType.value = typeMap[type] !== undefined ? typeMap[type] : 0;

      // 重构外框机身
      const outerShape = createShapePath(type, 1.22);
      outerShape.holes = [createShapePath(type, 1.0)];
      const newFrameGeom = new THREE.ExtrudeGeometry(outerShape, {
        depth: 1.0,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.015,
        bevelThickness: 0.015
      });
      newFrameGeom.translate(0, 0, -1.0);
      frameMesh.geometry.dispose();
      frameMesh.geometry = newFrameGeom;

      // 重构封底
      const newBackGeom = new THREE.ShapeGeometry(createShapePath(type, 1.22));
      backCover.geometry.dispose();
      backCover.geometry = newBackGeom;

      // 重构镜片
      const newMirrorGeom = new THREE.ShapeGeometry(createShapePath(type, 1.0));
      frontMirror.geometry.dispose();
      frontMirror.geometry = newMirrorGeom;

      // 仅重绘 UI 指引框，保留用户在透明层上的所有手绘图案
      drawUIGuide(type);
    }

    const shapeButtons = document.querySelectorAll('.shape-btn');
    const shapeValText = document.getElementById('shapeValText');
    const shapeLabelMap = { triangle: '三角形', square: '正方形', circle: '圆形', rect16_9: '16:9 竖屏' };

    shapeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        shapeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const shape = btn.getAttribute('data-shape');
        shapeValText.textContent = shapeLabelMap[shape];
        setMirrorShape(shape);
      });
    });

    // 间距厚度自适应
    const depthSlider = document.getElementById('depthSlider');
    const depthValText = document.getElementById('depthValText');
    function updateCavityDepth(val) {
      mirrorShaderMat.uniforms.uCavityDepth.value = val;
      depthValText.textContent = `${val.toFixed(2)} m`;
      const physicalDepth = Math.max(0.25, val * 2.0);
      frameMesh.scale.set(1, 1, physicalDepth);
      backCover.position.z = -physicalDepth;
    }
    depthSlider.addEventListener('input', (e) => updateCavityDepth(parseFloat(e.target.value)));
    updateCavityDepth(0.18);

    // 亮度调节
    const brightSlider = document.getElementById('brightSlider');
    const brightValText = document.getElementById('brightValText');
    brightSlider.addEventListener('input', (e) => {
      const b = parseFloat(e.target.value);
      mirrorShaderMat.uniforms.uBrightness.value = b;
      brightValText.textContent = `${b.toFixed(1)}x`;
    });

    // 镜面深度（光线最远传导距离 / 反射层数调节）
    const maxDepthSlider = document.getElementById('maxDepthSlider');
    const maxDepthValText = document.getElementById('maxDepthValText');
    maxDepthSlider.addEventListener('input', (e) => {
      const d = parseFloat(e.target.value);
      mirrorShaderMat.uniforms.uMaxBounces.value = d;
      maxDepthValText.textContent = `${d} 层`;
    });

    // 窗口尺寸自适应
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 渲染循环与视差解算
    const invModelMatrix = new THREE.Matrix4();
    const localEye = new THREE.Vector3();

    // ========================================== 
    // 5. 陀螺仪真体感视差系统 (如手持真实深渊镜)
    // ========================================== 
    let isGyroActive = false;
    let gyroCalibrated = false;
    let baseBeta = 0, baseGamma = 0;
    let curBeta = 0, curGamma = 0;
    let activeRadius = 6.2;
    const savedCamPos = new THREE.Vector3(0, 0, 6.2);

    function onDeviceOrientation(e) {
      if (!isGyroActive) return;
      const b = e.beta || 0;
      const g = e.gamma || 0;
      if (!gyroCalibrated) {
        baseBeta = b;
        baseGamma = g;
        gyroCalibrated = true;
      }
      curBeta = b;
      curGamma = g;
    }

    const gyroToggleBtn = document.getElementById('gyroToggleBtn');
    const gyroStatusDot = document.getElementById('gyroStatusDot');
    const gyroStatusText = document.getElementById('gyroStatusText');
    const resetViewBtn = document.getElementById('resetViewBtn');

    // 智能正面满屏居中：依据实际画板与屏幕尺寸精准对齐，消除保守黑边
    function resetToFrontView() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const fitDist = isPortrait
        ? (1.45 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / camera.aspect) * 0.70
        : 4.6;
      activeRadius = THREE.MathUtils.clamp(fitDist, 2.2, 7.5);
      camera.position.set(0, 0, activeRadius);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.update();
      savedCamPos.copy(camera.position);
      if (isGyroActive) {
        gyroCalibrated = false;
      }
    }
    if (resetViewBtn) resetViewBtn.addEventListener('click', resetToFrontView);

    function toggleGyro() {
      if (!isGyroActive) {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              if (state === 'granted') activateGyro();
              else alert('请允许运动传感器权限以体验陀螺仪');
            })
            .catch(() => activateGyro());
        } else {
          activateGyro();
        }
      } else {
        deactivateGyro();
      }
    }

    function activateGyro() {
      isGyroActive = true;
      gyroCalibrated = false;
      // 继承并锁定当前实际缩放距离（放多大就多大，绝不强制缩放回退）
      activeRadius = Math.max(1.8, camera.position.distanceTo(controls.target));
      savedCamPos.copy(camera.position);
      controls.enabled = false;
      window.addEventListener('deviceorientation', onDeviceOrientation, true);
      gyroToggleBtn.classList.remove('off');
      gyroToggleBtn.style.background = 'rgba(255, 170, 0, 0.25)';
      gyroStatusDot.textContent = '●';
      gyroStatusText.textContent = '陀螺仪：开启';
    }

    function deactivateGyro() {
      isGyroActive = false;
      window.removeEventListener('deviceorientation', onDeviceOrientation, true);
      controls.enabled = true;
      camera.position.set(0, 0, activeRadius);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.update();
      gyroToggleBtn.classList.add('off');
      gyroToggleBtn.style.background = 'transparent';
      gyroStatusDot.textContent = '○';
      gyroStatusText.textContent = '陀螺仪：关闭';
    }

    gyroToggleBtn.addEventListener('click', toggleGyro);

    function renderLoop() {
      requestAnimationFrame(renderLoop);

      if (isGyroActive && gyroCalibrated) {
        const dBeta = THREE.MathUtils.clamp(curBeta - baseBeta, -45, 45);
        const dGamma = THREE.MathUtils.clamp(curGamma - baseGamma, -45, 45);

        // 动态基于用户当前的缩放距离 activeRadius 计算视差，放大到全屏时依然保持贴脸沉浸倾斜
        const tiltAmp = Math.min(activeRadius * 0.52, 3.8);
        const targetX = (dGamma / 45.0) * tiltAmp;
        const targetY = -(dBeta / 45.0) * tiltAmp;
        const radSq = activeRadius * activeRadius;
        const targetZ = Math.sqrt(Math.max(0.1, radSq - targetX * targetX - targetY * targetY));

        camera.position.x += (targetX - camera.position.x) * 0.12;
        camera.position.y += (targetY - camera.position.y) * 0.12;
        camera.position.z += (targetZ - camera.position.z) * 0.12;
        camera.lookAt(0, 0, 0);
      } else {
        controls.update();
      }

      mirrorAssembly.updateMatrixWorld();
      invModelMatrix.copy(frontMirror.matrixWorld).invert();
      localEye.copy(camera.position).applyMatrix4(invModelMatrix);
      mirrorShaderMat.uniforms.uCameraLocal.value.copy(localEye);

      renderer.render(scene, camera);
    }
    renderLoop();
  </script>
</body>
</html>
